; Vorlage — kopieren nach inventory.ini (ist gitignored) und IPv6 eintragen.
; DHBWCloud ist IPv6-only, Adressen in eckigen Klammern.

[k3s_server]
smartpark-server ansible_host=<ipv6-adresse>

[k3s_agents]
; optional, falls der RAM eines Nodes nicht reicht
; smartpark-agent-1 ansible_host=<ipv6-adresse>

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
