{{- if .Values.spark.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-processing
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Release.Name }}-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-processing
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-processing
    spec:
      containers:
        - name: processing
          image: "{{ .Values.spark.image.repository }}:{{ .Values.spark.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: KAFKA_BROKERS
              value: "{{ .Release.Name }}-kafka:9092"
            - name: KAFKA_TOPIC
              value: "{{ .Values.config.kafka.topic }}"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin123"
            - name: BUCKET
              value: "{{ .Values.config.storage.bucket }}"
            - name: WINDOW_DURATION
              value: "{{ .Values.config.processing.windowDuration }}"
            - name: WATERMARK_DELAY
              value: "{{ .Values.config.processing.watermarkDelay }}"
            - name: CHECKPOINT_DIR
              value: "/tmp/checkpoints"
          resources:
{{ toYaml .Values.spark.resources | indent 12 }}
{{- end }}
