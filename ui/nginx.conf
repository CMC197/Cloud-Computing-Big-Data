server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Routing: unbekannte Pfade auf index.html, sonst 404 beim Reload
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laufzeit-Konfiguration (API-URL) nicht cachen
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
